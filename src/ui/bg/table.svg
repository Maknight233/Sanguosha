<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- 牌桌：淡宣纸纹理，四角各一抹淡墨远山，中部留白 -->
  <defs>
    <radialGradient id="paper" cx="50%" cy="48%" r="75%">
      <stop offset="0" stop-color="#ece2c9"/>
      <stop offset="1" stop-color="#d9cbaa"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .5 -.2"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .03" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .26  0 0 0 .6 -.25"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>

  <g filter="url(#soft)" fill="#5f5a50" opacity=".16">
    <path d="M-40,1040 L-40,760 C40,700 100,640 180,680 C240,710 270,640 340,660 C420,684 460,780 540,820 C600,850 640,940 700,1040 Z"/>
    <path d="M1640,1040 L1640,740 C1580,700 1520,740 1470,720 C1400,692 1360,780 1290,810 C1220,840 1170,940 1120,1040 Z"/>
    <path d="M1640,-40 L1640,200 C1580,230 1540,170 1480,190 C1420,210 1390,140 1320,130 C1260,122 1230,40 1180,-40 Z"/>
    <path d="M-40,-40 L-40,170 C20,200 70,140 130,160 C190,180 220,110 280,90 C330,74 360,10 380,-40 Z"/>
  </g>
  <circle cx="1460" cy="110" r="34" fill="#c4553b" opacity=".12"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity=".4"/>
</svg>
